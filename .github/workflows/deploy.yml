# Deploy pela GitHub Action, e não mais pela integração Git do Cloudflare: publica só depois dos
# testes verdes. Fica desligado (o passo pula) enquanto os segredos CLOUDFLARE_API_TOKEN e
# CLOUDFLARE_ACCOUNT_ID não existirem no repositório — até lá, quem publica é a integração do
# Cloudflare, como sempre. Para ativar: criar os segredos (token "Edit Cloudflare Workers") e
# desconectar a integração em Workers → cgu → Settings → Builds → Disconnect.
name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  # O `secrets` não vale no `if` de job: o portão dos segredos é dentro do passo.
  deploy:
    needs: testes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Publicar (sem os segredos, pula)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN ausente: nada a publicar (o deploy segue pela integração do Cloudflare)."
            exit 0
          fi
          npm ci
          npm run build
          npx wrangler deploy
